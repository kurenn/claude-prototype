<!doctype html>
<html lang="en" data-theme="daylight" data-layout="editorial" data-persona="default" data-motion="expressive">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Not found · claude-prototype</title>
  <script>
    (function () {
      try {
        var t = localStorage.getItem('proto-theme');
        if (t) {
          document.documentElement.setAttribute('data-theme', t);
        } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
          document.documentElement.setAttribute('data-theme', 'ember');
        }
        var m = localStorage.getItem('proto-motion');
        document.documentElement.setAttribute('data-motion', (m === 'calm' || m === 'standard') ? m : 'expressive');
      } catch (e) {}
    })();
  </script>
  <script src="js/vt.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Instrument+Sans:wght@400;500&family=Chivo+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: {
      colors: {
        surface:  'rgb(var(--surface)  / <alpha-value>)',
        elevated: 'rgb(var(--elevated) / <alpha-value>)',
        accent:   'rgb(var(--accent)   / <alpha-value>)',
        muted:    'rgb(var(--muted)    / <alpha-value>)',
        ink:      'rgb(var(--ink)      / <alpha-value>)',
        ink2:     'rgb(var(--ink2)     / <alpha-value>)',
        ink3:        'rgb(var(--ink3)        / <alpha-value>)',
        hairline:    'rgb(var(--hairline)    / <alpha-value>)',
        'elevated-2':'rgb(var(--elevated-2)  / <alpha-value>)',
        'accent-ink':'rgb(var(--accent-ink)  / <alpha-value>)',
      },
      fontFamily: {
        heading: ['Bricolage Grotesque','system-ui','sans-serif'],
        body:    ['Instrument Sans','system-ui','sans-serif'],
        mono:    ['Chivo Mono','ui-monospace','monospace'],
      },
      borderRadius: { proto: 'var(--radius)' },
    }}};
  </script>
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/feedback.css" />
</head>
<body class="bg-surface text-ink font-body antialiased min-h-screen flex flex-col items-center justify-center p-6">

  <main class="text-center max-w-md">
    <p class="font-mono text-sm tracking-[.16em] text-ink2 uppercase mb-4">404</p>
    <h1 class="font-heading text-4xl md:text-5xl font-extrabold tracking-tight mb-3">Nothing here.</h1>
    <p class="text-ink2 mb-8 text-lg">The page you're looking for doesn't exist — or never did. Could be a dead link in the prototype.</p>
    <div class="flex flex-wrap gap-2 justify-center">
      <a href="index.html" class="rounded-proto bg-ink text-surface px-4 py-2 text-sm font-semibold">Back home</a>
      <a href="javascript:history.back()" class="rounded-proto border border-hairline px-4 py-2 text-sm">Go back</a>
    </div>
  </main>

  <script src="js/state.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/motion.js"></script>
</body>
</html>
