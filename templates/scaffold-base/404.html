<!doctype html>
<html lang="en" data-theme="studio" data-layout="3col" data-persona="default" data-motion="standard">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Not found · {{PRODUCT_NAME}}</title>
  <script>
    // Anti-FOUC: apply the stored theme + motion tier before first paint so navigation
    // doesn't flash and the incoming page's transition CSS resolves at the right intensity.
    // Keep the theme name + dark fallback in sync with js/theme.js (THEMES / DARK_THEME),
    // and the motion default in sync with js/motion.js (DEFAULT_TIER).
    (function () {
      try {
        var t = localStorage.getItem('proto-theme');
        if (t) {
          document.documentElement.setAttribute('data-theme', t);
        } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
          document.documentElement.setAttribute('data-theme', 'terminal'); // DARK_THEME in theme.js
        }
        // Motion tier gates transition intensity — set before first paint (see index.html).
        document.documentElement.setAttribute('data-motion', localStorage.getItem('proto-motion') || 'standard');
      } catch (e) {}
    })();
  </script>
  <!-- Cross-document View Transitions — in <head>, NON-deferred, before Tailwind CDN.
       `pagereveal` fires before first paint; a deferred load would miss it. No-op where
       unsupported. (This page has no header/#proto-controls to isolate; root transition only.) -->
  <script src="js/vt.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family={{HEADING_FONT}}:wght@500;700&family={{BODY_FONT}}:wght@400;500&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: {
      colors: {
        surface:  'rgb(var(--surface)  / <alpha-value>)',
        elevated: 'rgb(var(--elevated) / <alpha-value>)',
        accent:   'rgb(var(--accent)   / <alpha-value>)',
        muted:    'rgb(var(--muted)    / <alpha-value>)',
        ink:      'rgb(var(--ink)      / <alpha-value>)',
        ink2:     'rgb(var(--ink2)     / <alpha-value>)',
        ink3:        'rgb(var(--ink3)        / <alpha-value>)',
        hairline:    'rgb(var(--hairline)    / <alpha-value>)',
        'elevated-2':'rgb(var(--elevated-2)  / <alpha-value>)',
        'accent-ink':'rgb(var(--accent-ink)  / <alpha-value>)',
      },
      fontFamily: { heading: ['{{HEADING_FONT}}','system-ui','serif'], body: ['{{BODY_FONT}}','system-ui','sans-serif'] },
      borderRadius: { proto: 'var(--radius)' },
    }}};
  </script>
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/feedback.css" />
</head>
<body class="bg-surface text-ink font-body antialiased min-h-screen flex flex-col items-center justify-center p-6">

  <main class="text-center max-w-md">
    <p class="text-sm tracking-wide text-ink2 uppercase mb-4">404</p>
    <h1 class="font-heading text-4xl md:text-5xl font-medium tracking-tight mb-3">Nothing here.</h1>
    <p class="text-ink2 mb-8">The page you're looking for doesn't exist — or never did. Could be a dead link in the prototype.</p>
    <div class="flex gap-2 justify-center">
      <a href="index.html" class="rounded-proto bg-ink text-surface px-4 py-2 text-sm font-medium">Back home</a>
      <a href="javascript:history.back()" class="rounded-proto border border-muted/40 px-4 py-2 text-sm">Go back</a>
    </div>
  </main>

  <script src="js/state.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/motion.js"></script>
</body>
</html>
